[tool.poetry.group.dev.dependencies]
coverage = "~7.15.4"
pytest = "*"
mock = "*"
pylint = "~4.0.6"
yamllint = "~1.38.0"
invoke = "~3.0.3"
attrs = "^23.2.0"
towncrier = "~25.8.0"
ruff = "~0.16.2"
Markdown = "*"

[tool.poetry.group.docs.dependencies]
# Rendering docs to HTML
mkdocs = "~1.6.1"
# Embedding YAML files into Markdown documents as tables
markdown-data-tables = "~1.0.0"
# Render custom markdown for version added/changed/remove notes
markdown-version-annotations = "~1.0.1"
# Automatically generate some files as part of mkdocs build
mkdocs-gen-files = "~0.6.1"
# Image lightboxing in mkdocs
mkdocs-glightbox = "~0.5.2"
# Use Jinja2 templating in docs - see settings.md
mkdocs-macros-plugin = "~1.5.0"
# Material for mkdocs theme
mkdocs-material = "~9.7.7"
# Handle docs redirections
mkdocs-redirects = "~1.2.3"
# Automatically handle index pages for docs sections
mkdocs-section-index = "~0.3.12"
# Automatic documentation from sources, for MkDocs
mkdocstrings = "~1.0.6"
# Python-specific extension to mkdocstrings
mkdocstrings-python = "~2.0.5"

[tool.poetry.scripts]
pylint_nautobot = 'pylint_nautobot.cli:main'

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "D",  # pydocstyle
    "F", "E", "W",  # flake8
    "PL",  # pylint
    "S",  # bandit
    "I",  # isort
]
ignore = [
    # warning: `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible.
    "D203", # 1 blank line required before class docstring

    # D212 is enabled by default in google convention, and complains if we have a docstring like:
    # """
    # My docstring is on the line after the opening quotes instead of on the same line as them.
    # """
    # We've discussed and concluded that we consider this to be a valid style choice.
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line

    # Produces a lot of issues in the current codebase.
    "D401", # First line of docstring should be in imperative mood
    "D407", # Missing dashed underline after section
    "D416", # Section name ends in colon
    "E501", # Line too long
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",
    "S"
]


[tool.pylint.master]
ignore=[".venv", "tests"]

[tool.pylint.basic]
# No docstrings required for private methods (Pylint default), or for test_ functions, or for inner Meta classes.
no-docstring-rgx = "^(_|test_|Meta$)"


[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "duplicate-code",
    "cyclic-import",
    ]

[tool.pylint.miscellaneous]
# Don't flag TODO as a failure, let us commit with things that still need to be done in the code
notes = """,
    FIXME,
    XXX,
    """

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
python_paths = "./"
testpaths = [
    "tests/"
]
addopts = "-vv --doctest-modules -p no:warnings --ignore-glob='*mock*'"
norecursedirs = [
    "tests/inputs",
]
filterwarnings = [
    "ignore:The end_col_offset attribute of MessageTest.*:DeprecationWarning",
    "ignore:The end_line attribute of MessageTest.*:DeprecationWarning",
]

[tool.towncrier]
package = "pylint_nautobot"
directory = "changes"
filename = "docs/admin/release_notes/version_1.1.md"
template = "development/towncrier_template.j2"
start_string = "<!-- towncrier release notes start -->"
issue_format = "[#{issue}](https://github.com/nautobot/pylint-nautobot/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "housekeeping"
name = "Housekeeping"
showcontent = true
